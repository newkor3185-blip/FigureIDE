name: CI

# Quality gates for every push to main and every pull request (`cargo xtask ci`), through the
# suite's shared gate workflow in craft-common-actions.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a PR branch cancels its older run; every push to main runs to the end.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    # Tracks @main so suite-wide CI fixes reach every app without a PR in each repository.
    uses: storytold/craft-common-actions/.github/workflows/gate.yml@main
    with:
      # Same craft-fonts commit as release.yml.
      craft-fonts-ref: b076417b5880bd4154bd22f00695b1d28c6bea83
      timeout-minutes: 90
      command: |
        export R_LIBS_USER="$RUNNER_TEMP/R-library"
        mkdir -p "$R_LIBS_USER"
        Rscript -e 'ggplot2_archive <- file.path(Sys.getenv("R_LIBS_USER"), "ggplot2_3.5.1.tar.gz"); download.file("https://cran.r-project.org/src/contrib/Archive/ggplot2/ggplot2_3.5.1.tar.gz", ggplot2_archive, quiet = TRUE); install.packages(ggplot2_archive, repos = NULL, type = "source"); stopifnot(packageVersion("ggplot2") >= "3.5.1")'
        Rscript -e 'BiocManager::install("airway", ask = FALSE, update = FALSE)'
        cargo xtask ci
      packages: >-
        pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxcb1-dev libxcursor-dev
        libxrandr-dev libxi-dev libfontconfig1-dev libfreetype-dev mesa-vulkan-drivers
        libgl1-mesa-dev r-base r-cran-biocmanager r-cran-ggplot2 r-cran-svglite r-cran-pheatmap
        r-bioc-deseq2 r-bioc-summarizedexperiment
