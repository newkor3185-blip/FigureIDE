name: FigureIDE Windows Release

on:
  push:
    tags:
      - 'v*'
      - 'rvs-v*'
      - 'figureide-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build FigureIDE
        shell: pwsh
        run: cargo build --locked --release -p vectorcraft

      - name: Create Windows ZIP
        shell: pwsh
        run: |
          $isTag = "${{ github.ref }}".StartsWith("refs/tags/")
          if ($isTag) {
            $rawVer = "${{ github.ref_name }}"
            if ($rawVer.StartsWith("rvs-v")) {
              $ver = "v" + $rawVer.Substring(5)
            } elseif ($rawVer.StartsWith("figureide-v")) {
              $ver = "v" + $rawVer.Substring(11)
            } else {
              $ver = $rawVer
            }
          } else {
            $shortSha = "${{ github.sha }}".Substring(0, 8)
            $ver = "v0.1.0-beta.1-dev-$shortSha"
          }

          $folder = "FigureIDE-$ver-Windows-x64"
          $inner = "$folder/FigureIDE"
          New-Item -ItemType Directory -Force $inner | Out-Null

          Copy-Item "target/release/vectorcraft.exe" "$inner/FigureIDE.exe"

          if (Test-Path "LICENSE-MIT") {
            Copy-Item "LICENSE-MIT" "$inner/LICENSE.txt"
          } elseif (Test-Path "LICENSE-APACHE") {
            Copy-Item "LICENSE-APACHE" "$inner/LICENSE.txt"
          }

          $commitSha = "${{ github.sha }}"
          $buildDate = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")

          @"
          ==================================================
          FigureIDE (Windows Portable x64)
          ==================================================
          
          Version: $ver
          Commit:  $commitSha
          Built:   $buildDate
          
          Portable Usage:
          ---------------
          1. Extract this archive to any folder of your choice.
          2. Run FigureIDE.exe directly.
             - No administrator privileges or system installer required.
             - Runs independently without modifying system registry.
          
          Folder-Based FigureIDE Projects:
          --------------------------------
          FigureIDE uses folder-based projects containing:
            <ProjectName>/
            ├── project.json            # Project manifest and tab/view configuration
            ├── scripts/                # Authoritative editable R scripts (*.R)
            ├── workspace/              # R workspace snapshot (workspace.RData)
            ├── figures/                # Individual figure documents (*.fide)
            └── assets/                 # Embedded or referenced assets
          
          Opening Projects & Documents:
          -----------------------------
          - Open Project Folder:
              Drag and drop a project folder onto FigureIDE.exe, or run:
                FigureIDE.exe "C:\Path\To\ProjectFolder"
              Or select File ▸ Open Project in the application.
          - Open Standalone Figure (.fide):
              Drag and drop a .fide figure document onto FigureIDE.exe, or run:
                FigureIDE.exe "C:\Path\To\Figure.fide"
          - Offline Art Viewing:
              Saved figures and Hybrid Linked Plots display instantly with full fidelity
              even on systems without R installed.
          
          Explicit Save / Load R Workspace:
          ---------------------------------
          - FigureIDE separates document vector editing from R memory persistence.
          - To save your active R session workspace (.GlobalEnv):
              Click 'Save R Workspace' in the Environment panel or File ▸ Save R Workspace.
              Saved to workspace/workspace.RData atomically.
          - To restore your R session:
              Click 'Load R Workspace' in the Environment panel or File ▸ Load R Workspace.
              Includes collision detection and safe reconnection.
          
          R Requirements & Diagnostics:
          -----------------------------
          R is optional. Vector editing, .fide viewing/saving, and regular SVG/PDF export work without R.
          Install R only to run analysis scripts or re-render R-linked figures:
          1. Install R (>= 4.0 recommended) from https://cran.r-project.org/bin/windows/base/
          2. In R or RStudio, install the rendering packages:
               install.packages(c("ggplot2", "svglite", "systemfonts"), repos = "https://cloud.r-project.org")
          3. Restart FigureIDE and use the Environment panel or Packages tab to inspect packages.
          
          Optional .fide File Association:
          --------------------------------
          This is a portable ZIP distribution. It does not touch your Windows registry
          unless you choose to run the optional association helper:
          - register-fide-association.cmd: Associates .fide figure files with this executable.
          - unregister-fide-association.cmd: Removes the .fide association.
          
          Issues & Releases:
          ------------------
          GitHub Releases: https://github.com/newkor3185-blip/R_vector_studio/releases
          GitHub Issues:   https://github.com/newkor3185-blip/R_vector_studio/issues
          "@ | Set-Content "$inner/README.txt" -Encoding UTF8

          @"
          commit=$commitSha
          version=$ver
          build_date=$buildDate
          target=x86_64-pc-windows-msvc
          "@ | Set-Content "$inner/BUILD_INFO.txt" -Encoding UTF8

          @"
          @echo off
          REM Register .fide file association with this portable FigureIDE executable
          assoc .fide=FigureIDE.Figure
          ftype FigureIDE.Figure="%~dp0FigureIDE.exe" "%%1"
          echo .fide figure file association registered to %~dp0FigureIDE.exe
          pause
          "@ | Set-Content "$inner/register-fide-association.cmd" -Encoding ASCII

          @"
          @echo off
          REM Remove .fide file association
          assoc .fide=
          ftype FigureIDE.Figure=
          echo .fide figure file association removed.
          pause
          "@ | Set-Content "$inner/unregister-fide-association.cmd" -Encoding ASCII

          Compress-Archive -Path "$folder/*" -DestinationPath "$folder.zip" -Force

          "ZIP_FILE=$folder.zip" | Out-File -FilePath $env:GITHUB_ENV -Append
          "PACKAGE_FOLDER=$folder" | Out-File -FilePath $env:GITHUB_ENV -Append
          "RELEASE_VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Validate Package & Startup Smoke Test
        shell: pwsh
        run: |
          $zipPath = $env:ZIP_FILE
          if (-not (Test-Path $zipPath)) {
            Write-Error "Expected ZIP $zipPath does not exist!"
            exit 1
          }

          # Extract to an unrelated temporary directory to test portable extraction
          $testExtract = Join-Path $env:TEMP "fig_extract_test_$(Get-Random)"
          Expand-Archive -Path $zipPath -DestinationPath $testExtract -Force

          $exe = Get-ChildItem -Path $testExtract -Filter "FigureIDE.exe" -Recurse | Select-Object -First 1
          if ($null -eq $exe) {
            Write-Error "FigureIDE.exe missing from extracted archive!"
            exit 1
          }

          $readme = Get-ChildItem -Path $testExtract -Filter "README.txt" -Recurse | Select-Object -First 1
          if ($null -eq $readme) {
            Write-Error "README.txt missing from extracted archive!"
            exit 1
          }

          # Verify standalone invocation (version / help)
          & $exe.FullName --help
          & $exe.FullName --version

          Remove-Item -Recurse -Force $testExtract
          Write-Host "Portable package validation passed."

      - name: Start FigureIDE without an R environment
        shell: pwsh
        run: |
          $exe = (Get-ChildItem -Path $env:PACKAGE_FOLDER -Filter "FigureIDE.exe" -Recurse | Select-Object -First 1).FullName
          $previousPath = $env:PATH
          $previousRHome = $env:R_HOME
          $process = $null
          try {
            $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
            Remove-Item Env:R_HOME -ErrorAction SilentlyContinue
            $port = Get-Random -Minimum 30000 -Maximum 50000
            $writeRoot = $env:RUNNER_TEMP
            $process = Start-Process -FilePath $exe -ArgumentList "--control $port --automation-write-root `"$writeRoot`"" -PassThru -WindowStyle Hidden
            $ready = $false
            for ($attempt = 0; $attempt -lt 60; $attempt++) {
              if ($process.HasExited) {
                throw "FigureIDE exited before the control server became ready (exit code $($process.ExitCode))."
              }
              $client = [System.Net.Sockets.TcpClient]::new()
              try {
                $client.Connect("127.0.0.1", $port)
                $ready = $true
                break
              } catch {
                Start-Sleep -Seconds 1
              } finally {
                $client.Dispose()
              }
            }
            if (-not $ready) {
              throw "FigureIDE did not start its control server within 60 seconds without R in PATH or R_HOME."
            }
            function Invoke-FigureIDEControl([string]$method, [hashtable]$params) {
              $client = [System.Net.Sockets.TcpClient]::new()
              try {
                $client.Connect("127.0.0.1", $port)
                $stream = $client.GetStream()
                $encoding = [System.Text.UTF8Encoding]::new($false)
                $writer = [System.IO.StreamWriter]::new($stream, $encoding, 1024, $true)
                $reader = [System.IO.StreamReader]::new($stream, $encoding, $false, 1024, $true)
                $request = @{ id = 1; method = $method; params = $params } | ConvertTo-Json -Compress -Depth 20
                $writer.WriteLine($request)
                $writer.Flush()
                $line = $reader.ReadLine()
                if ([string]::IsNullOrWhiteSpace($line)) {
                  throw "FigureIDE returned no response to $method."
                }
                $response = $line | ConvertFrom-Json
                if (-not $response.ok) {
                  throw "FigureIDE $method failed: $($response.error)"
                }
                return $response.result
              } finally {
                $client.Dispose()
              }
            }
            Invoke-FigureIDEControl "engine.execute" @{ command = "shape.rectangle"; params = @{ x = 10; y = 10; width = 80; height = 50 } } | Out-Null
            $project = Join-Path $writeRoot "r-free-smoke.fide"
            $svg = Join-Path $writeRoot "r-free-smoke.svg"
            $pdf = Join-Path $writeRoot "r-free-smoke.pdf"
            Invoke-FigureIDEControl "app.save" @{ path = $project; wait = $true } | Out-Null
            Invoke-FigureIDEControl "app.export" @{ path = $svg; format = "svg"; wait = $true } | Out-Null
            Invoke-FigureIDEControl "app.export" @{ path = $pdf; format = "pdf"; wait = $true } | Out-Null
            foreach ($file in @($project, $svg, $pdf)) {
              if (-not (Test-Path $file) -or (Get-Item $file).Length -eq 0) {
                throw "Expected R-free vector output was not written: $file"
              }
            }
            if (-not (Get-Content -LiteralPath $svg -Raw).Contains("<svg")) {
              throw "The R-free SVG export is missing its SVG root element."
            }
            $pdfHeader = [System.Text.Encoding]::ASCII.GetString([System.IO.File]::ReadAllBytes($pdf)[0..4])
            if ($pdfHeader -ne "%PDF-") {
              throw "The R-free PDF export has an invalid PDF signature."
            }
            Write-Host "FigureIDE started, edited, saved, and exported SVG/PDF without an R environment."
          } finally {
            if ($null -ne $process -and -not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
            }
            foreach ($file in @("r-free-smoke.fide", "r-free-smoke.svg", "r-free-smoke.pdf")) {
              Remove-Item -LiteralPath (Join-Path $env:RUNNER_TEMP $file) -Force -ErrorAction SilentlyContinue
            }
            $env:PATH = $previousPath
            if ($null -eq $previousRHome) {
              Remove-Item Env:R_HOME -ErrorAction SilentlyContinue
            } else {
              $env:R_HOME = $previousRHome
            }
          }

      - name: Upload ZIP as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: FigureIDE-Windows-x64
          path: ${{ env.ZIP_FILE }}
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create "${{ github.ref_name }}" `
            "${{ env.ZIP_FILE }}" `
            --title "FigureIDE ${{ github.ref_name }}" `
            --notes "FigureIDE Windows portable release (${{ github.ref_name }}). Source commit: ${{ github.sha }}" `
            --prerelease
