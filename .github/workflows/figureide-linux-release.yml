name: FigureIDE Linux Artifact

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      release_version:
        required: true
        type: string
      source_sha:
        required: true
        type: string

permissions:
  contents: read

jobs:
  linux-x86_64:
    name: Ubuntu Linux x86_64
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}

      - name: Verify source commit and release version
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          EXPECTED_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          if [[ -n "$EXPECTED_SOURCE_SHA" && "$actual_sha" != "$EXPECTED_SOURCE_SHA" ]]; then
            echo "checked out $actual_sha, expected $EXPECTED_SOURCE_SHA" >&2
            exit 1
          fi
          manifest_version="$(awk '/^\[workspace\.package\]/{p=1;next} /^\[/{p=0} p && $1=="version"{gsub(/[" ]/,"",$3);print $3;exit}' Cargo.toml)"
          if [[ -n "$RELEASE_VERSION" && "$manifest_version" != "$RELEASE_VERSION" ]]; then
            echo "release version $RELEASE_VERSION does not match Cargo version $manifest_version" >&2
            exit 1
          fi
          {
            echo "SOURCE_COMMIT=$actual_sha"
            echo "MANIFEST_VERSION=$manifest_version"
          } >> "$GITHUB_ENV"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install Linux and R dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libxkbcommon-dev libxkbcommon-x11-0 libxcb-xkb1 \
            libwayland-dev libx11-dev libxcb1-dev libxcursor-dev libxrandr-dev libxi-dev \
            libfontconfig1-dev libfreetype-dev libgl1-mesa-dev mesa-vulkan-drivers \
            r-base r-cran-ggplot2 r-cran-svglite r-cran-systemfonts
          echo "R_LIBS_USER=$RUNNER_TEMP/R-library" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/R-library"

      - name: Check R plotting dependencies
        run: |
          Rscript -e 'install.packages(c("ggplot2", "svglite", "systemfonts"), lib=Sys.getenv("R_LIBS_USER"), repos="https://cloud.r-project.org")'
          R_LIBS_USER="$R_LIBS_USER" Rscript -e 'stopifnot(requireNamespace("ggplot2", quietly = TRUE), requireNamespace("svglite", quietly = TRUE), requireNamespace("systemfonts", quietly = TRUE)); cat(R.version.string, "\n")'
          R_LIBS_USER="$R_LIBS_USER" Rscript -e 'svg <- tempfile(fileext=".svg"); svglite::svglite(svg, width=7, height=5); print(ggplot2::ggplot(iris, ggplot2::aes(Sepal.Length, Sepal.Width, colour=Species)) + ggplot2::geom_point()); grDevices::dev.off(); text <- paste(readLines(svg), collapse="\n"); stopifnot(grepl("<svg", text, fixed=TRUE), nchar(text) > 200); unlink(svg)'

      - name: Format check
        run: cargo fmt --all --check

      - name: Cargo check
        run: cargo check --locked -p vectorcraft

      - name: Clippy
        run: cargo clippy --locked -p vectorcraft --all-targets -- -D warnings

      - name: FigureIDE package tests
        run: cargo test --locked -p vectorcraft

      - name: R workspace UI tests
        run: cargo test --locked -p vectorcraft-ui-egui --lib r_workspace_

      - name: Build Linux executable
        run: cargo build --locked --release -p vectorcraft

      - name: Generate third-party dependency notices
        run: |
          cargo install --locked --version 0.9.3 --features cli cargo-about
          cargo about generate --manifest-path apps/vectorcraft/Cargo.toml --fail --locked \
            --output-file target/THIRD-PARTY-LICENSES.md about.hbs
          test -s target/THIRD-PARTY-LICENSES.md

      - name: Package portable archive
        env:
          FIGUREIDE_RELEASE_VERSION: ${{ inputs.release_version }}
          VECTORCRAFT_BUILD_SHA: ${{ inputs.source_sha || github.sha }}
        run: packaging/figureide-linux/package.sh

      - name: Verify package contents and executable
        run: |
          mkdir -p target/linux-package-check
          tar -xzf "$FIGUREIDE_ARCHIVE" -C target/linux-package-check
          package=target/linux-package-check/FigureIDE-Linux-x86_64
          test -x "$package/FigureIDE"
          test -s "$package/LICENSE-MIT"
          test -s "$package/LICENSE-APACHE"
          test -s "$package/NOTICE"
          test -s "$package/ASSETS.md"
          test -s "$package/THIRD-PARTY-LICENSES.md"
          test -s "$package/BUILD_INFO.txt"
          test -s "$package/licenses/pdf-backend/hayro-cmap/LICENSE.txt"
          test -s "$package/asset-licenses/app-icon/LICENSE-figureide.txt"
          test -n "$(find "$package/asset-licenses" -type f -print -quit)"
          grep -Fqx "version=$MANIFEST_VERSION" "$package/BUILD_INFO.txt"
          grep -Fqx "commit=$SOURCE_COMMIT" "$package/BUILD_INFO.txt"
          test "$("$package/FigureIDE" --version)" = "FigureIDE $MANIFEST_VERSION"
          "$package/FigureIDE" --help >/dev/null
          sha256sum "$FIGUREIDE_ARCHIVE"

      - name: Upload Linux archive
        uses: actions/upload-artifact@v4
        with:
          name: FigureIDE-Linux-x86_64
          path: ${{ inputs.release_version && format('dist/FigureIDE-v{0}-Linux-x86_64.tar.gz', inputs.release_version) || 'dist/FigureIDE-Linux-x86_64.tar.gz' }}
          if-no-files-found: error
