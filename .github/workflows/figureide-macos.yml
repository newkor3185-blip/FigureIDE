name: FigureIDE macOS Build

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/figureide-macos.yml'
      - 'apps/vectorcraft/**'
      - 'crates/**'
      - 'assets/**'
      - '.cargo/**'
      - 'packaging/figureide-macos/**'
      - 'packaging/env.sh'
      - 'packaging/macos/Info.plist.in'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'README.md'
      - 'licenses/**'
      - 'LICENSE-MIT'
      - 'LICENSE-APACHE'
      - 'NOTICE'
      - 'ASSETS.md'
      - 'about.hbs'
  workflow_dispatch:
  workflow_call:
    inputs:
      release_version:
        required: true
        type: string
      source_sha:
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Apple Silicon (arm64)
            runner: macos-15
            target: aarch64-apple-darwin
            architecture: arm64
            artifact: AppleSilicon
            package_arch: apple-silicon
          - name: Intel (x86_64)
            runner: macos-15-intel
            target: x86_64-apple-darwin
            architecture: x86_64
            artifact: Intel
            package_arch: intel
    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'
      CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
      CRAFT_FONTS_REQUIRED: '1'
    steps:
      - name: Check out FigureIDE
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}

      - name: Verify source commit and release version
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          EXPECTED_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          if [[ -n "$EXPECTED_SOURCE_SHA" && "$actual_sha" != "$EXPECTED_SOURCE_SHA" ]]; then
            echo "checked out $actual_sha, expected $EXPECTED_SOURCE_SHA" >&2
            exit 1
          fi
          manifest_version="$(awk '/^\[workspace\.package\]/{p=1;next} /^\[/{p=0} p && $1=="version"{gsub(/[" ]/,"",$3);print $3;exit}' Cargo.toml)"
          if [[ -n "$RELEASE_VERSION" && "$manifest_version" != "$RELEASE_VERSION" ]]; then
            echo "release version $RELEASE_VERSION does not match Cargo version $manifest_version" >&2
            exit 1
          fi
          {
            echo "SOURCE_COMMIT=$actual_sha"
            echo "MANIFEST_VERSION=$manifest_version"
          } >> "$GITHUB_ENV"

      - name: Check out pinned craft-fonts
        uses: actions/checkout@v4
        with:
          repository: storytold/craft-fonts
          ref: b076417b5880bd4154bd22f00695b1d28c6bea83
          path: craft-fonts

      - name: Verify native runner architecture
        run: test "$(uname -m)" = '${{ matrix.architecture }}'

      - name: Install Rust and target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: clippy, rustfmt

      - name: Initialize R package library
        run: |
          echo "R_LIBS_USER=$RUNNER_TEMP/R-library" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/R-library"

      - name: Install R and plotting packages
        run: |
          brew list --versions r >/dev/null 2>&1 || brew install --quiet r
          mkdir -p "$R_LIBS_USER"
          Rscript -e 'install.packages(c("ggplot2", "svglite", "systemfonts"), lib=Sys.getenv("R_LIBS_USER"), repos="https://cloud.r-project.org")'
          R_LIBS_USER="$R_LIBS_USER" Rscript -e 'stopifnot(requireNamespace("ggplot2", quietly=TRUE), requireNamespace("svglite", quietly=TRUE), requireNamespace("systemfonts", quietly=TRUE)); cat(R.version.string, "\n")'
          R_LIBS_USER="$R_LIBS_USER" Rscript -e 'svg <- tempfile(fileext=".svg"); svglite::svglite(svg, width=7, height=5); print(ggplot2::ggplot(iris, ggplot2::aes(Sepal.Length, Sepal.Width, colour=Species)) + ggplot2::geom_point()); grDevices::dev.off(); text <- paste(readLines(svg), collapse="\n"); stopifnot(grepl("<svg", text, fixed=TRUE), nchar(text) > 200); unlink(svg)'

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Cargo check
        run: cargo check --locked -p vectorcraft --target ${{ matrix.target }}

      - name: Clippy
        run: cargo clippy --locked -p vectorcraft --target ${{ matrix.target }} --all-targets -- -D warnings

      - name: FigureIDE app tests
        run: cargo test --locked -p vectorcraft --target ${{ matrix.target }}

      - name: R and ggplot2 FigureIDE integration test
        run: cargo test --locked -p vectorcraft-ui-egui --lib --target ${{ matrix.target }} ggplot_objects_are_discovered_and_rendered_as_vector_svg

      - name: Graph Inspector regression tests
        run: cargo test --locked -p vectorcraft-ui-egui --lib --target ${{ matrix.target }} r_workspace_stage4_inspector_

      - name: Build FigureIDE
        run: cargo build --locked --release -p vectorcraft --target ${{ matrix.target }}

      - name: Generate third-party dependency notices
        run: |
          cargo install --locked --version 0.9.3 --features cli cargo-about
          cargo about generate --manifest-path apps/vectorcraft/Cargo.toml --fail --locked \
            --output-file target/THIRD-PARTY-LICENSES.md about.hbs
          test -s target/THIRD-PARTY-LICENSES.md

      - name: Assemble and validate FigureIDE.app
        env:
          FIGUREIDE_RELEASE_VERSION: ${{ inputs.release_version }}
          VECTORCRAFT_BUILD_SHA: ${{ inputs.source_sha || github.sha }}
        run: DIST=dist packaging/figureide-macos/package.sh ${{ matrix.package_arch }}

      - name: Upload macOS ZIP
        uses: actions/upload-artifact@v4
        with:
          name: FigureIDE-macOS-${{ matrix.artifact }}
          path: ${{ inputs.release_version && format('dist/FigureIDE-v{0}-macOS-{1}.zip', inputs.release_version, matrix.artifact) || format('dist/FigureIDE-macOS-{0}.zip', matrix.artifact) }}
          if-no-files-found: error
          retention-days: 14
